<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauty Box</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">Beauty Box</div>
      <a href="#join" class="cta">Join Waitlist</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Your Beauty, Delivered.</h1>
    <p>On-demand hair, makeup, and glam — anytime, anywhere.</p>
    <a href="#join" class="hero-btn">Join Waitlist</a>
  </section>

  <section class="footer" id="join">
    <h2>Be First To Know</h2>
    <p>Enter your email to join the waitlist.</p>
    <form>
      <input type="email" placeholder="Email Address" />
      <button type="submit">Notify Me</button>
    </form>
  </section>
</body>
</html>
